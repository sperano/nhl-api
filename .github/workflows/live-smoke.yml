name: Live smoke

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # Runs every `#[ignore]`d live-NHL-API test: the live sweep over every
      # Client method (tests/live_sweep.rs) and the integration tests. The
      # `live` nextest profile (.config/nextest.toml) skips fixture capture.
      - run: cargo nextest run --workspace --profile live --run-ignored only
