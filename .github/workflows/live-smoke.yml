name: Live smoke

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - run: >-
          cargo nextest run --workspace -E
          "binary_id(nhl_api::play_by_play_integration) |
          binary_id(nhl_api::player_game_log_integration)"
