name: Live smoke

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live-smoke:
    name: live-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      # The `live` nextest profile (.config/nextest.toml) selects exactly the
      # two live-NHL-API integration test binaries that ci.yml's `default`
      # profile excludes, so the list of binaries lives in one place.
      - run: cargo nextest run --workspace --profile live
