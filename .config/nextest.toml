# Single source of truth for the live-NHL-API integration test binaries,
# shared by ci.yml (`default` profile, excludes them) and live-smoke.yml
# (`live` profile, runs only them), so the list only needs updating here.

[profile.default]
default-filter = 'not (binary_id(nhl_api::play_by_play_integration) | binary_id(nhl_api::player_game_log_integration))'

[profile.live]
default-filter = 'binary_id(nhl_api::play_by_play_integration) | binary_id(nhl_api::player_game_log_integration)'
