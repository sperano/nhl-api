# Tests that call the live NHL API are `#[ignore]`d, so plain `cargo test` and
# `cargo nextest run` (ci.yml) stay hermetic. live-smoke.yml runs them with
# `--profile live --run-ignored only`.

[profile.live]
# `capture_fixtures` rewrites tests/fixtures and only runs on request.
default-filter = 'not test(=capture_fixtures)'
# Print the live sweep's per-case report even when it passes.
success-output = "final"
